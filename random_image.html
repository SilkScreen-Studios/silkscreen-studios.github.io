<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Random Internet Image</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        #image-container {
            max-width: 90vw;
            max-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            object-fit: contain;
        }
        #status {
            margin-top: 15px;
            font-size: 1.1rem;
            opacity: 0.8;
            text-align: center;
        }
        #view-count {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #4CAF50;
            font-weight: 600;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <div id="image-container">
        <p>Press ANY key to fetch a random image!</p>
    </div>
    <div id="status">Press any key to start</div>
    <div id="view-count"></div>

    <script>
        const container = document.getElementById('image-container');
        const status = document.getElementById('status');
        const viewCountEl = document.getElementById('view-count');

        // Namespace for Counter API to keep your counts distinct
        const NAMESPACE = "silkscreen-studios-wiki";

        async function updateViewCount(imageId) {
            viewCountEl.innerText = "Checking view history...";
            try {
                // Increment view count for this specific Wikimedia Page ID
                const res = await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/img_${imageId}/up`);
                const data = await res.json();
                
                const count = data.count;
                if (count <= 1) {
                    viewCountEl.innerText = "You are the first to see this image";
                } else {
                    viewCountEl.innerText = `${count} people have seen this image`;
                }
            } catch (err) {
                // Fail silently on analytics if API is blocked or offline
                viewCountEl.innerText = "";
            }
        }

        async function fetchRandomImage() {
            status.innerText = "Searching the web...";
            viewCountEl.innerText = "";
            
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + 
                'action=query&generator=random&grnnamespace=6&grnlimit=10' + 
                '&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const pages = data.query.pages;
                
                for (let id in pages) {
                    const info = pages[id].imageinfo?.[0];
                    if (info && info.mime.startsWith('image/')) {
                        container.innerHTML = `<img src="${info.url}" alt="Random image">`;
                        status.innerText = "Press ANY key for another random image!";
                        
                        // Track/Display views using Wikimedia's unique page ID
                        updateViewCount(id);
                        return;
                    }
                }
                fetchRandomImage();
            } catch (err) {
                status.innerText = "Error fetching image. Press any key to try again.";
            }
        }

        document.addEventListener('keydown', fetchRandomImage);
    </script>
</body>
</html>

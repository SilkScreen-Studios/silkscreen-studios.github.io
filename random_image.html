<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Random Internet Image</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        body {
            margin: 0;
            padding-bottom: 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #top-target {
            position: absolute;
            top: 0;
        }
        #image-container {
            max-width: 90vw;
            max-height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
            cursor: pointer;
        }
        img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            object-fit: contain;
            pointer-events: none;
        }
        #status {
            margin-top: 15px;
            font-size: 1.1rem;
            opacity: 0.8;
            text-align: center;
            cursor: pointer;
        }
        #view-count {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #4CAF50;
            font-weight: bold;
            min-height: 1.4em;
            text-align: center;
            transition: all 0.3s ease;
        }
        #view-count.rare-find {
            color: #e63946;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.4);
            margin-top: 15px;
        }
        .nav-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            margin: 10px 0;
        }
        .nav-btn:hover {
            background: #444;
        }
        /* Message Board Section */
        #message-board {
            width: 90vw;
            max-width: 500px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #username-display {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        #comment-form {
            display: flex;
            gap: 5px;
            width: 100%;
            margin-bottom: 15px;
        }
        #comment-input {
            flex: 1;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 0.9rem;
        }
        #send-btn {
            padding: 8px 12px;
            background: #2196F3;
            border: none;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        #comments-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .comment-card {
            background: #222;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #2196F3;
            font-size: 0.9rem;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
        }
        .comment-author {
            color: #ffb703;
            font-weight: bold;
        }
        .comment-text {
            word-break: break-word;
        }
        #adblock-notice {
            position: fixed;
            bottom: 12px;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            max-width: 80%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="top-target"></div>

    <div id="image-container">
        <p>Tap the screen or click to fetch a random image!</p>
    </div>
    <div id="status">Tap screen or click to start</div>
    <div id="view-count"></div>

    <!-- Scroll to bottom button -->
    <button class="nav-btn" onclick="scrollToBottom()">↓ Jump to Messages</button>

    <!-- Username + Password Auth Box -->
    <div id="auth-container" style="margin: 15px 0; text-align: center;">
        <div id="logged-in-view" style="display: none;">
            <span>Posting as: <strong id="active-username" style="color: #ffb703;"></strong></span>
            <button onclick="logoutUser()" style="margin-left: 10px; padding: 4px 8px;">Switch User</button>
        </div>

        <div id="login-form">
            <input type="text" id="auth-user" placeholder="Username (max 10 chars)" maxlength="10" style="padding: 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;">
            <input type="password" id="auth-pass" placeholder="Password (min 8 chars)" style="padding: 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;">
            <button onclick="handleLoginOrRegister()" style="padding: 6px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Login / Register</button>
        </div>
    </div>
    <!-- Message Board -->
    <div id="message-board">
        <div id="username-display"></div>
        
        <div id="comment-form">
            <input type="text" id="comment-input" maxlength="25" placeholder="Leave a message (max 25 chars)...">
            <button id="send-btn" onclick="submitMessage()">Post</button>
        </div>

        <div id="comments-list"></div>
    </div>

    <!-- Scroll to top button -->
    <button class="nav-btn" onclick="scrollToTop()">↑ Back to Top</button>
    <div id="bottom-target"></div>

    <div id="adblock-notice">Note: If you use an adblocker, features may be restricted.</div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://silkscreen-studios-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const container = document.getElementById('image-container');
        const status = document.getElementById('status');
        const viewCountEl = document.getElementById('view-count');
        const commentsList = document.getElementById('comments-list');
        const commentInput = document.getElementById('comment-input');
        const sendBtn = document.getElementById('send-btn');
        const usernameDisplay = document.getElementById('username-display');

        let currentImageId = null;
        let currentDbListener = null; // Store active image listener to unbind when moving to next image
        let isCooldown = false;
        let cooldownTimer = null;
        const clickTimestamps = [];
        let spamPenaltyMultiplier = parseInt(localStorage.getItem('spamMultiplier')) || 1;

        // 1. Custom 10-Character Username Prompt
        function getOrCreateUsername() {
            let user = localStorage.getItem('unique_username');
            
            if (!user) {
                let input = prompt("Choose a unique username (max 10 characters):");
                
                if (!input || input.trim() === "") {
                    input = "User_" + Math.floor(1000 + Math.random() * 9000);
                }
                
                user = input.trim().replace(/\s+/g, '_').substring(0, 10);
                localStorage.setItem('unique_username', user);
            }
            
            usernameDisplay.innerText = `Your Username: ${user}`;
            return user;
        }

        const username = getOrCreateUsername();

        // Helper function to re-enable input for a new image
        function enableCommentForm() {
            commentInput.disabled = false;
            commentInput.value = "";
            commentInput.placeholder = "Leave a message (max 25 chars)...";
            sendBtn.disabled = false;
        }

        // Helper function to disable input if already posted on THIS image
        function disableCommentForm() {
            commentInput.disabled = true;
            commentInput.value = "";
            commentInput.placeholder = "You have already left a message!";
            sendBtn.disabled = true;
        }

        // 2. Fetch and Display Messages
        function loadMessages(imageId) {
            // Clean up previous database listener if exists
            if (currentDbListener && currentImageId) {
                db.ref(`messages/${currentImageId}`).off('value', currentDbListener);
            }

            // Always reset the input form state first whenever loading a new image
            enableCommentForm();
            commentsList.innerHTML = "Loading messages...";
            
            const imageCommentsRef = db.ref(`messages/${imageId}`);
            
            currentDbListener = imageCommentsRef.on('value', (snapshot) => {
                commentsList.innerHTML = "";
                const data = snapshot.val();
                
                if (!data) {
                    commentsList.innerHTML = "<p style='font-size:0.85rem; color:#666;'>No messages left for this image yet.</p>";
                    enableCommentForm();
                    return;
                }

                let userHasPostedOnThisImage = false;

                Object.values(data).forEach(msg => {
                    if (msg.author === username) {
                        userHasPostedOnThisImage = true;
                    }

                    const card = document.createElement('div');
                    card.className = 'comment-card';
                    card.innerHTML = `
                        <div class="comment-header">
                            <span class="comment-author">${msg.author}</span>
                            <span>${msg.date}</span>
                        </div>
                        <div class="comment-text">${msg.text}</div>
                    `;
                    commentsList.appendChild(card);
                });

                // Enforce 1 comment per unique image per user
                if (userHasPostedOnThisImage) {
                    disableCommentForm();
                } else {
                    enableCommentForm();
                }
            });
        }

        // 3. Submit Message
        function submitMessage() {
    if (!currentLoggedUser) {
        alert("You must log in with a username and password first!");
        return;
    }

    const text = commentInput.value.trim();
    if (!text || !currentImageId) return;

    const now = new Date();
    const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear().toString().slice(-2)}`;

    const messageData = {
        author: currentLoggedUser,
        text: text.substring(0, 25),
        date: dateStr
    };

    db.ref(`messages/${currentImageId}`).push(messageData)
        .then(() => {
            commentInput.value = "";
        })
        .catch((error) => {
            alert("Storage limit reached or network error! New comments cannot be accepted right now.");
        });
}
        function scrollToBottom() {
            document.getElementById('bottom-target').scrollIntoView({ behavior: 'smooth' });
        }
        function scrollToTop() {
            document.getElementById('top-target').scrollIntoView({ behavior: 'smooth' });
        }

        function startCooldown(seconds, isSpamPenalty = false, setEndTime = true) {
            isCooldown = true;
            let remaining = seconds;

            if (setEndTime) {
                const endTime = Date.now() + (seconds * 1000);
                localStorage.setItem('timeoutEnd', endTime);
                localStorage.setItem('timeoutType', isSpamPenalty ? 'spam' : 'rare');
            }
            
            const messagePrefix = isSpamPenalty 
                ? "Don't spam click! Images are shown to look at, not speed through. Wait " 
                : "RARE FIND! Wait ";

            status.innerText = `${messagePrefix}${remaining}s to generate next image...`;

            if (cooldownTimer) clearInterval(cooldownTimer);

            cooldownTimer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    status.innerText = `${messagePrefix}${remaining}s to generate next image...`;
                } else {
                    clearInterval(cooldownTimer);
                    isCooldown = false;
                    localStorage.removeItem('timeoutEnd');
                    localStorage.removeItem('timeoutType');
                    status.innerText = "Tap screen or click for another image!";
                }
            }, 1000);
        }

        function checkSpamClicks() {
            const now = Date.now();
            clickTimestamps.push(now);

            while (clickTimestamps.length > 0 && clickTimestamps[0] <= now - 1000) {
                clickTimestamps.shift();
            }

            if (clickTimestamps.length >= 4) {
                const timeoutDuration = 5 * spamPenaltyMultiplier;
                spamPenaltyMultiplier++;
                localStorage.setItem('spamMultiplier', spamPenaltyMultiplier);
                clickTimestamps.length = 0;
                viewCountEl.classList.remove("rare-find");
                viewCountEl.innerText = "";
                startCooldown(timeoutDuration, true);
                return true;
            }
            return false;
        }

        async function updateViewCount(imageId) {
            viewCountEl.classList.remove("rare-find");
            viewCountEl.innerText = "Checking view history...";
            
            try {
                const res = await fetch(`https://abacus.jasoncameron.dev/hit/silkscreen-studios.github.io/img_${imageId}`);
                if (!res.ok) throw new Error('Counter unreachable');
                
                const data = await res.json();
                const count = data.value || 1;
                
                if (count <= 1) {
                    viewCountEl.innerText = "You are the first to see this image";
                } else {
                    viewCountEl.classList.add("rare-find");
                    viewCountEl.innerText = `${count} people have seen this image!`;
                    startCooldown(10, false);
                }
            } catch (err) {
                viewCountEl.innerText = "You are the first to see this image";
            }
        }

        async function fetchRandomImage() {
            if (isCooldown) return;
            if (checkSpamClicks()) return;

            status.innerText = "Searching the web...";
            viewCountEl.classList.remove("rare-find");
            viewCountEl.innerText = "";
            
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + 
                'action=query&generator=random&grnnamespace=6&grnlimit=10' + 
                '&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const pages = data.query.pages;
                
                for (let id in pages) {
                    const info = pages[id].imageinfo?.[0];
                    if (info && info.mime.startsWith('image/')) {
                        currentImageId = id;
                        container.innerHTML = `<img src="${info.url}" alt="Random image">`;
                        status.innerText = "Tap screen or click for another image!";
                        
                        updateViewCount(id);
                        loadMessages(id);
                        return;
                    }
                }
                fetchRandomImage();
            } catch (err) {
                status.innerText = "Error fetching image. Tap or click to try again.";
            }
        }

        container.addEventListener('click', fetchRandomImage);
        status.addEventListener('click', fetchRandomImage);
    </script>
</body>
</html>

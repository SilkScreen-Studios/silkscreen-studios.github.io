<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Random Internet Image</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        #image-container {
            max-width: 90vw;
            max-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            object-fit: contain;
            pointer-events: none;
        }
        #status {
            margin-top: 15px;
            font-size: 1.1rem;
            opacity: 0.8;
            text-align: center;
        }
        #view-count {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #4CAF50;
            font-weight: bold;
            min-height: 1.4em;
            text-align: center;
            transition: all 0.3s ease;
        }
        /* Special highlight styling for rare returning images */
        #view-count.rare-find {
            color: #e63946;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.4);
            margin-top: 15px;
        }
        #adblock-notice {
            position: fixed;
            bottom: 12px;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            max-width: 80%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="image-container">
        <p>Tap the screen or press ANY key to fetch a random image!</p>
    </div>
    <div id="status">Tap screen or press key to start</div>
    <div id="view-count"></div>
    <div id="adblock-notice">Note: If you use an adblocker, the view counter feature may be blocked from displaying.</div>

    <script>
        const container = document.getElementById('image-container');
        const status = document.getElementById('status');
        const viewCountEl = document.getElementById('view-count');

        let isCooldown = false;
        let cooldownTimer = null;

        function startCooldown(seconds) {
            isCooldown = true;
            let remaining = seconds;
            
            status.innerText = `RARE FIND! Wait ${remaining}s to generate next image...`;

            cooldownTimer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    status.innerText = `RARE FIND! Wait ${remaining}s to generate next image...`;
                } else {
                    clearInterval(cooldownTimer);
                    isCooldown = false;
                    status.innerText = "Tap screen or press ANY key for another image!";
                }
            }, 1000);
        }

        async function updateViewCount(imageId) {
            viewCountEl.classList.remove("rare-find");
            viewCountEl.innerText = "Checking view history...";
            
            try {
                const res = await fetch(`https://abacus.jasoncameron.dev/hit/silkscreen-studios.github.io/img_${imageId}`);
                
                if (!res.ok) throw new Error('Counter unreachable');
                
                const data = await res.json();
                const count = data.value || 1;
                
                if (count <= 1) {
                    viewCountEl.innerText = "You are the first to see this image";
                } else {
                    // Highlight repeat hits and trigger 10s cooldown lock
                    viewCountEl.classList.add("rare-find");
                    viewCountEl.innerText = `${count} people have seen this image!`;
                    startCooldown(10);
                }
            } catch (err) {
                viewCountEl.innerText = "You are the first to see this image";
            }
        }

        async function fetchRandomImage() {
            // Block input during lock period
            if (isCooldown) return;

            status.innerText = "Searching the web...";
            viewCountEl.classList.remove("rare-find");
            viewCountEl.innerText = "";
            
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + 
                'action=query&generator=random&grnnamespace=6&grnlimit=10' + 
                '&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const pages = data.query.pages;
                
                for (let id in pages) {
                    const info = pages[id].imageinfo?.[0];
                    if (info && info.mime.startsWith('image/')) {
                        container.innerHTML = `<img src="${info.url}" alt="Random image">`;
                        status.innerText = "Tap screen or press ANY key for another image!";
                        
                        updateViewCount(id);
                        return;
                    }
                }
                fetchRandomImage();
            } catch (err) {
                status.innerText = "Error fetching image. Tap or press key to try again.";
            }
        }

        document.addEventListener('keydown', fetchRandomImage);
        document.addEventListener('click', fetchRandomImage);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silkscreen Studios - Random Image Viewer</title>
    <link rel="apple-touch-icon" sizes="180x180" href="extras/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="extras/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="extras/favicon-16x16.png">
    <link rel="manifest" href="extras/site.webmanifest">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #container-wrapper {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        #image-container {
            width: 100%;
            min-height: 300px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #image-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        #status {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #view-count {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #888;
        }
        .rare-find {
            color: #ffb703 !important;
            font-weight: bold;
        }
        .nav-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        /* Auth Box Styles */
        #auth-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        #auth-container input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: #fff;
            margin: 3px;
        }
        .auth-btn {
            padding: 8px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Comment Section Styles */
        #message-board {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        #comment-form {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        #comment-input {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: #fff;
        }
        #send-btn {
            padding: 8px 12px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #send-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .comment-card {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .comment-author {
            color: #ffb703;
            font-weight: bold;
        }
        .comment-text {
            font-size: 0.9rem;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div id="top-target"></div>

<div id="container-wrapper">
    <div id="image-container">
        <p style="color:#666;">Click/Tap to generate image</p>
    </div>
    
    <div id="status">Tap screen or click for another image!</div>
    <div id="view-count"></div>

    <button class="nav-btn" onclick="scrollToBottom()">↓ Jump to Messages</button>

    <!-- Username + Password Login Box -->
    <div id="auth-container">
        <div id="logged-in-view" style="display: none;">
            <span>Logged in as: <strong id="active-username" style="color: #ffb703;"></strong></span>
            <button onclick="logoutUser()" class="nav-btn" style="margin-left: 10px; padding: 4px 8px; margin-bottom:0;">Switch Account</button>
        </div>

        <div id="login-form">
            <input type="text" id="auth-user" placeholder="Username (max 10 chars)" maxlength="10">
            <input type="password" id="auth-pass" placeholder="Password (min 8 chars)">
            <button onclick="handleLoginOrRegister()" class="auth-btn">Login / Register</button>
        </div>
    </div>

    <!-- Comments Section -->
    <div id="message-board">
        <div id="comment-form">
            <input type="text" id="comment-input" maxlength="25" placeholder="Please log in above to comment..." disabled>
            <button id="send-btn" onclick="submitMessage()" disabled>Post</button>
        </div>

        <div id="comments-list"></div>
    </div>

    <button class="nav-btn" onclick="scrollToTop()" style="margin-top: 15px;">↑ Back to Top</button>
</div>

<div id="bottom-target"></div>

<script>
    // Initialize Firebase Realtime Database
    const firebaseConfig = {
        databaseURL: "https://silkscreen-studios-default-rtdb.europe-west1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Elements
    const container = document.getElementById('image-container');
    const status = document.getElementById('status');
    const viewCountEl = document.getElementById('view-count');
    const commentsList = document.getElementById('comments-list');
    const commentInput = document.getElementById('comment-input');
    const sendBtn = document.getElementById('send-btn');

    let currentImageId = null;
    let currentDbListener = null;
    let isCooldown = false;
    let cooldownTimer = null;
    const clickTimestamps = [];
    let spamPenaltyMultiplier = parseInt(localStorage.getItem('spamMultiplier')) || 1;

    // --- AUTH LOGIC (Username + Password) ---
    let currentLoggedUser = localStorage.getItem('claimed_username') || null;

    function checkUserSession() {
        const loggedInView = document.getElementById('logged-in-view');
        const loginForm = document.getElementById('login-form');
        const activeUserSpan = document.getElementById('active-username');

        if (currentLoggedUser) {
            loggedInView.style.display = 'block';
            loginForm.style.display = 'none';
            activeUserSpan.innerText = currentLoggedUser;
            
            // Enable comments if user hasn't posted on current image
            if (currentImageId) loadMessages(currentImageId);
        } else {
            loggedInView.style.display = 'none';
            loginForm.style.display = 'block';
            commentInput.disabled = true;
            commentInput.placeholder = "Please log in above to leave a comment.";
            sendBtn.disabled = true;
        }
    }

    async function handleLoginOrRegister() {
        const userInput = document.getElementById('auth-user').value.trim().replace(/\s+/g, '_');
        const passInput = document.getElementById('auth-pass').value.trim();

        if (!userInput || userInput.length > 10) {
            alert("Username must be between 1 and 10 characters!");
            return;
        }

        const userRef = db.ref(`users/${userInput}`);
        const snapshot = await userRef.once('value');

        if (snapshot.exists()) {
            // --- EXISTING USER LOG IN ---
            // Handles both old object structure ({password: "..."}) and new slim string ("...")
            const savedData = snapshot.val();
            const savedPassword = (typeof savedData === 'object' && savedData !== null) 
                ? savedData.password 
                : savedData;

            if (savedPassword === passInput) {
                currentLoggedUser = userInput;
                localStorage.setItem('claimed_username', userInput);
                alert(`Welcome back, ${userInput}!`);
                checkUserSession();
            } else {
                alert("Incorrect password for this username!");
            }
        } else {
            // --- NEW USER REGISTRATION ---
            // Strictly enforces EXACTLY 8 characters to prevent storage bloat
            if (passInput.length !== 8) {
                alert("New passwords must be exactly 8 characters long!");
                return;
            }

            // Save directly as a slim string to minimize storage
            await userRef.set(passInput);
            currentLoggedUser = userInput;
            localStorage.setItem('claimed_username', userInput);
            alert(`Account created! Logged in as ${userInput}.`);
            checkUserSession();
        }
    }

    function logoutUser() {
        localStorage.removeItem('claimed_username');
        currentLoggedUser = null;
        checkUserSession();
    }

    // --- MESSAGE LOGIC ---
    // --- MESSAGE LOGIC (Slim Storage + Backward Compatible) ---
    // --- MESSAGE LOGIC (Slim Storage + Date + Emoji Filter) ---
    
    // Helper function to remove emojis from string
    function removeEmojis(str) {
        // Regex covering standard emojis, symbols, pictographs, and emoticons
        return str.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}\u{2B50}\u{2B55}]/gu, '');
    }

    function loadMessages(imageId) {
        if (currentDbListener && currentImageId) {
            db.ref(`messages/${currentImageId}`).off('value', currentDbListener);
        }

        commentsList.innerHTML = "Loading messages...";
        
        const imageCommentsRef = db.ref(`messages/${imageId}`);
        
        currentDbListener = imageCommentsRef.on('value', (snapshot) => {
            commentsList.innerHTML = "";
            const data = snapshot.val();
            
            if (!data) {
                commentsList.innerHTML = "<p style='font-size:0.85rem; color:#666;'>No messages left for this image yet.</p>";
                if (currentLoggedUser) {
                    commentInput.disabled = false;
                    commentInput.placeholder = "Leave a message (max 25 chars)...";
                    sendBtn.disabled = false;
                }
                return;
            }

            let userHasPostedOnThisImage = false;

            Object.values(data).forEach(msg => {
                // Reads slim keys ('a', 't', 'd') with fallback to old keys ('author', 'text', 'date')
                const author = msg.a || msg.author || "Anonymous";
                const commentText = msg.t || msg.text || "";
                
                // Keep past emojis intact, display new or old date strings
                const dateStr = msg.d || msg.date || "";

                if (currentLoggedUser && author === currentLoggedUser) {
                    userHasPostedOnThisImage = true;
                }

                const card = document.createElement('div');
                card.className = 'comment-card';
                card.innerHTML = `
                    <div class="comment-header">
                        <span class="comment-author">${author}</span>
                        <span>${dateStr}</span>
                    </div>
                    <div class="comment-text">${commentText}</div>
                `;
                commentsList.appendChild(card);
            });

            // Restrict to 1 comment per user per image
            if (userHasPostedOnThisImage) {
                commentInput.disabled = true;
                commentInput.value = "";
                commentInput.placeholder = "You have already left a message!";
                sendBtn.disabled = true;
            } else if (currentLoggedUser) {
                commentInput.disabled = false;
                commentInput.placeholder = "Leave a message (max 25 chars)...";
                sendBtn.disabled = false;
            }
        });
    }

    function submitMessage() {
        if (!currentLoggedUser) {
            alert("Please log in first!");
            return;
        }

        let text = commentInput.value.trim();
        
        // Strip emojis from new message
        text = removeEmojis(text);

        if (!text) {
            alert("Comments cannot consist only of emojis or whitespace!");
            return;
        }

        if (!currentImageId) return;

        // Generate compact date string: e.g. "8/8/26"
        const now = new Date();
        const dateStr = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear().toString().slice(-2)}`;

        // Ultra-slim payload: 'a' = author, 't' = text, 'd' = date
        const messageData = {
            a: currentLoggedUser,
            t: text.substring(0, 25),
            d: dateStr
        };

        db.ref(`messages/${currentImageId}`).push(messageData)
            .then(() => {
                commentInput.value = "";
            })
            .catch((error) => {
                alert("Storage limit reached or error! New comments cannot be accepted right now.");
            });
    }
    // --- UTILITIES & NAVIGATION ---
    function scrollToBottom() {
        document.getElementById('bottom-target').scrollIntoView({ behavior: 'smooth' });
    }
    function scrollToTop() {
        document.getElementById('top-target').scrollIntoView({ behavior: 'smooth' });
    }

    function startCooldown(seconds, isSpamPenalty = false, setEndTime = true) {
        isCooldown = true;
        let remaining = seconds;

        if (setEndTime) {
            const endTime = Date.now() + (seconds * 1000);
            localStorage.setItem('timeoutEnd', endTime);
            localStorage.setItem('timeoutType', isSpamPenalty ? 'spam' : 'rare');
        }
        
        const messagePrefix = isSpamPenalty 
            ? "Don't spam click! Images are shown to look at, not speed through. Wait " 
            : "RARE FIND! Wait ";

        status.innerText = `${messagePrefix}${remaining}s to generate next image...`;

        if (cooldownTimer) clearInterval(cooldownTimer);

        cooldownTimer = setInterval(() => {
            remaining--;
            if (remaining > 0) {
                status.innerText = `${messagePrefix}${remaining}s to generate next image...`;
            } else {
                clearInterval(cooldownTimer);
                isCooldown = false;
                localStorage.removeItem('timeoutEnd');
                localStorage.removeItem('timeoutType');
                status.innerText = "Tap screen or click for another image!";
            }
        }, 1000);
    }

    function checkSpamClicks() {
        const now = Date.now();
        clickTimestamps.push(now);

        while (clickTimestamps.length > 0 && clickTimestamps[0] <= now - 1000) {
            clickTimestamps.shift();
        }

        if (clickTimestamps.length >= 4) {
            const timeoutDuration = 5 * spamPenaltyMultiplier;
            spamPenaltyMultiplier++;
            localStorage.setItem('spamMultiplier', spamPenaltyMultiplier);
            clickTimestamps.length = 0;
            viewCountEl.classList.remove("rare-find");
            viewCountEl.innerText = "";
            startCooldown(timeoutDuration, true);
            return true;
        }
        return false;
    }

    async function updateViewCount(imageId) {
        viewCountEl.classList.remove("rare-find");
        viewCountEl.innerText = "Checking view history...";
        
        try {
            const res = await fetch(`https://abacus.jasoncameron.dev/hit/silkscreen-studios.github.io/img_${imageId}`);
            if (!res.ok) throw new Error('Counter unreachable');
            
            const data = await res.json();
            const count = data.value || 1;
            
            if (count <= 1) {
                viewCountEl.innerText = "You are the first to see this image";
            } else {
                viewCountEl.classList.add("rare-find");
                viewCountEl.innerText = `${count} people have seen this image!`;
                startCooldown(10, false);
            }
        } catch (err) {
            viewCountEl.innerText = "You are the first to see this image";
        }
    }

    async function fetchRandomImage() {
        if (isCooldown) return;
        if (checkSpamClicks()) return;

        status.innerText = "Searching the web...";
        viewCountEl.classList.remove("rare-find");
        viewCountEl.innerText = "";
        
        const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + 
            'action=query&generator=random&grnnamespace=6&grnlimit=10' + 
            '&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            const pages = data.query.pages;
            
            for (let id in pages) {
                const info = pages[id].imageinfo?.[0];
                if (info && info.mime.startsWith('image/')) {
                    currentImageId = id;
                    container.innerHTML = `<img src="${info.url}" alt="Random image">`;
                    status.innerText = "Tap screen or click for another image!";
                    
                    updateViewCount(id);
                    loadMessages(id);
                    return;
                }
            }
            fetchRandomImage();
        } catch (err) {
            status.innerText = "Error fetching image. Tap or click to try again.";
        }
    }

    // Initialize session state on load
    checkUserSession();

    // Event listeners
    container.addEventListener('click', fetchRandomImage);
    status.addEventListener('click', fetchRandomImage);
</script>

</body>
</html>

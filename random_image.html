<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Random Internet Image</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
            /* Prevents double-tap zooming on mobile devices */
            touch-action: manipulation; 
            /* Prevents highlight box when tapping on mobile */
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        #image-container {
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }
        #status {
            margin-top: 20px;
            font-size: 1.1rem;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="image-container">
        <p>TAP the screen or press ANY key!</p>
    </div>
    <div id="status">Tap screen or press key to start</div>

    <script>
        const container = document.getElementById('image-container');
        const status = document.getElementById('status');
        let isLoading = false;

        async function fetchRandomImage(event) {
            // Prevent duplicate triggers if both touch and click fire
            if (event) event.preventDefault();
            
            // Don't fetch a new image if one is already loading
            if (isLoading) return; 
            isLoading = true;

            status.innerText = "Searching the web...";
            
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + 
                'action=query&generator=random&grnnamespace=6&grnlimit=10' + 
                '&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const pages = data.query.pages;
                
                for (let id in pages) {
                    const info = pages[id].imageinfo?.[0];
                    if (info && info.mime.startsWith('image/')) {
                        container.innerHTML = `<img src="${info.url}" alt="Random image">`;
                        status.innerText = "TAP screen or press ANY key for another!";
                        isLoading = false;
                        return;
                    }
                }
                isLoading = false;
                fetchRandomImage(); // Retry if batch had no valid bitmap images
            } catch (err) {
                status.innerText = "Error fetching image. Tap or press key to try again.";
                isLoading = false;
            }
        }

        // 1. Keyboard trigger (for desktop)
        document.addEventListener('keydown', fetchRandomImage);

        // 2. Touch trigger (for mobile phones/tablets)
        document.addEventListener('touchstart', fetchRandomImage, { passive: false });
    </script>
</body>
</html>

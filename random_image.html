<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Truly Random Internet Image</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        #image-container {
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }
        #status {
            margin-top: 20px;
            font-size: 1.1rem;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="image-container">
        <p>Press ANY key to fetch a random image!</p>
    </div>
    <div id="status">Press any key to start</div>

    <script>
        const container = document.getElementById('image-container');
        const status = document.getElementById('status');

        async function fetchRandomImage() {
            status.innerText = "Searching the web...";
            
            // Query Wikimedia Commons for a random File (namespace 6)
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + 
                'action=query&generator=random&grnnamespace=6&grnlimit=10' + 
                '&prop=imageinfo&iiprop=url|mime&format=json&origin=*';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const pages = data.query.pages;
                
                // Find the first valid image file (skipping audio/pdf/svgs)
                for (let id in pages) {
                    const info = pages[id].imageinfo?.[0];
                    if (info && info.mime.startsWith('image/')) {
                        container.innerHTML = `<img src="${info.url}" alt="Random image">`;
                        status.innerText = "Press ANY key for another random image!";
                        return;
                    }
                }
                // Retry if the batch didn't contain a direct bitmap image
                fetchRandomImage();
            } catch (err) {
                status.innerText = "Error fetching image. Press any key to try again.";
            }
        }

        // Trigger on any key press
        document.addEventListener('keydown', fetchRandomImage);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Rock Paper Scissors - SilkScreen Studios</title>

  <!-- Google Font: Fredoka (Fredoka One) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- PeerJS Library for P2P Matchmaking -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      background: #333333; /* Dark Charcoal from your site */
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .back-link {
      color: #a855f7; /* Purple accent */
      text-decoration: none;
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .card {
      background: #262626;
      padding: 2.5rem 2rem;
      border-radius: 1.2rem;
      border: 3px solid #3b82f6; /* Blue border accent */
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      color: #ffffff;
      font-size: 2.2rem;
      letter-spacing: 0.5px;
    }

    #status {
      font-size: 1.2rem;
      margin: 1.5rem 0;
      color: #38bdf8; /* Blue accent text */
    }

    #timer {
      font-size: 3rem;
      font-weight: 700;
      color: #ef4444;
      height: 3.5rem;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1rem;
    }

    button {
      background: #a855f7; /* Purple buttons */
      color: #ffffff;
      border: none;
      padding: 0.8rem 1.4rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 0.8rem;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #9333ea;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #525252;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .choice-btn {
      font-size: 1.5rem;
      padding: 1rem 1.2rem;
    }

    #match-btn {
      background: #38bdf8; /* Blue match button */
      color: #000000;
      width: 100%;
      font-size: 1.3rem;
    }

    #match-btn:hover:not(:disabled) {
      background: #0284c7;
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }

    .result {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 1rem;
    }

    .win { color: #4ade80; }
    .lose { color: #f87171; }
    .draw { color: #facc15; }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← Back to Main Site</a>

  <div class="card">
    <h1>Rock Paper Scissors</h1>
    <div id="status">Click below to find an online opponent.</div>
    <div id="timer" class="hidden">5</div>

    <button id="match-btn" onclick="startMatchmaking()">Find Online Match</button>

    <div id="game-controls" class="hidden">
      <p style="margin-bottom: 0.8rem; color: #ffffff; font-size: 1.1rem;">Pick your move before time runs out!</p>
      <div class="btn-group">
        <button class="choice-btn" onclick="makeMove('rock')">🪨 Rock</button>
        <button class="choice-btn" onclick="makeMove('paper')">📄 Paper</button>
        <button class="choice-btn" onclick="makeMove('scissors')">✂️ Scissors</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <div id="result-text" class="result"></div>
      <p id="moves-summary" style="color: #38bdf8; margin-top: 0.5rem; font-size: 1.1rem;"></p>
      <button onclick="startMatchmaking()" style="margin-top: 1rem;">Play Again</button>
    </div>
  </div>

  <script>
    const ROOM_PREFIX = "silkscreen_rps_lobby_";
    let peer = null;
    let conn = null;
    let myMove = null;
    let opponentMove = null;
    let countdownInterval = null;
    let timeLeft = 5;

    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const matchBtn = document.getElementById('match-btn');
    const gameControls = document.getElementById('game-controls');
    const resultScreen = document.getElementById('result-screen');
    const resultText = document.getElementById('result-text');
    const movesSummary = document.getElementById('moves-summary');

    function startMatchmaking() {
      resetUI();
      statusEl.textContent = "Connecting to matchmaking...";
      matchBtn.disabled = true;

      const hostRoomId = ROOM_PREFIX + "room1";
      peer = new Peer();

      peer.on('open', () => {
        statusEl.textContent = "Looking for an opponent...";
        conn = peer.connect(hostRoomId);
        setupConnection(false);

        setTimeout(() => {
          if (!conn || !conn.open) {
            if (conn) conn.close();
            peer.destroy();
            peer = new Peer(hostRoomId);

            peer.on('open', () => {
              statusEl.textContent = "Waiting for an opponent to join...";
            });

            peer.on('connection', (incomingConn) => {
              conn = incomingConn;
              setupConnection(true);
            });

            peer.on('error', () => {
              statusEl.textContent = "Retrying matchmaking...";
              setTimeout(startMatchmaking, 1000);
            });
          }
        }, 1500);
      });
    }

    function setupConnection(isHost) {
      conn.on('open', () => {
        statusEl.textContent = "Match found! Get ready...";
        setTimeout(startRound, 1000);
      });

      conn.on('data', (data) => {
        if (data.type === 'move') {
          opponentMove = data.choice;
          checkGameResult();
        }
      });

      conn.on('close', () => {
        statusEl.textContent = "Opponent left the match.";
        timerEl.classList.add('hidden');
        clearInterval(countdownInterval);
      });
    }

    function startRound() {
      statusEl.textContent = "Choose your move!";
      matchBtn.classList.add('hidden');
      gameControls.classList.remove('hidden');
      timerEl.classList.remove('hidden');

      timeLeft = 5;
      timerEl.textContent = timeLeft;

      countdownInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          if (!myMove) {
            const moves = ['rock', 'paper', 'scissors'];
            makeMove(moves[Math.floor(Math.random() * moves.length)]);
          }
        }
      }, 1000);
    }

    function makeMove(choice) {
      if (myMove) return;
      myMove = choice;

      const buttons = gameControls.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);

      statusEl.textContent = `You picked ${choice.toUpperCase()}. Waiting for opponent...`;

      if (conn && conn.open) {
        conn.send({ type: 'move', choice: choice });
      }

      checkGameResult();
    }

    function checkGameResult() {
      if (myMove && opponentMove) {
        clearInterval(countdownInterval);
        timerEl.classList.add('hidden');
        gameControls.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        movesSummary.textContent = `You: ${myMove.toUpperCase()} | Opponent: ${opponentMove.toUpperCase()}`;

        if (myMove === opponentMove) {
          resultText.textContent = "IT'S A DRAW!";
          resultText.className = "result draw";
        } else if (
          (myMove === 'rock' && opponentMove === 'scissors') ||
          (myMove === 'paper' && opponentMove === 'rock') ||
          (myMove === 'scissors' && opponentMove === 'paper')
        ) {
          resultText.textContent = "YOU WIN! 🎉";
          resultText.className = "result win";
        } else {
          resultText.textContent = "YOU LOSE! 😞";
          resultText.className = "result lose";
        }

        statusEl.textContent = "Game finished!";
        if (peer) peer.destroy();
      }
    }

    function resetUI() {
      myMove = null;
      opponentMove = null;
      clearInterval(countdownInterval);

      statusEl.textContent = "Click below to find an online opponent.";
      timerEl.classList.add('hidden');
      gameControls.classList.add('hidden');
      resultScreen.classList.add('hidden');
      matchBtn.classList.remove('hidden');
      matchBtn.disabled = false;

      const buttons = gameControls.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = false);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pirate Polls - Firebase Powered</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ccc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .option { margin: 0.5rem 0; }
    .admin { background: #f4f4f4; border-color: #aaa; }
    button { cursor: pointer; padding: 0.4rem 0.8rem; }
  </style>
</head>
<body>
  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyBVhhdmv0oszNRVUCHlBZoLwkyWxhpW-3U",
    authDomain: "silkscreen-betting.firebaseapp.com",
    databaseURL: "https://silkscreen-betting-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "silkscreen-betting",
    storageBucket: "silkscreen-betting.firebasestorage.app",
    messagingSenderId: "193124110923",
    appId: "1:193124110923:web:4892d8f23fa338d31033ce",
    measurementId: "G-ZQ26EVG86R"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

  <h1>Pirate Polls</h1>
  
  <div class="card">
    <strong>User ID:</strong> <span id="user-id">Loading...</span><br>
    <strong>Your Balance:</strong> <span id="balance">0</span> Doubloons
  </div>

  <div class="card" id="poll-container">
    <h2 id="poll-question">Loading poll...</h2>
    <div id="options-list"></div>
    <br>
    <label for="bet-amount">Wager Amount:</label>
    <input type="number" id="bet-amount" value="10" min="1">
    <button id="submit-bet" onclick="placeBet()" disabled>Place Bet</button>
    <p id="user-status"></p>
  </div>

  <!-- Admin Dashboard -->
  <div class="card admin">
    <h3>Admin Dashboard</h3>
    <button onclick="createNewPoll()">Initialize/Reset Poll</button><br><br>
    <label for="admin-winner">Select Winning Option:</label>
    <select id="admin-winner"></select>
    <button onclick="resolvePoll()">Close Poll & Pay Out</button>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, runTransaction, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. REPLACE THIS WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    const pollDocRef = doc(db, "polls", "active_poll");

    // 2. Authenticate User Anonymously
    signInAnonymously(auth).catch(err => console.error("Auth error:", err));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("user-id").innerText = user.uid;

        // Ensure user has a profile document in Firestore
        const userDocRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userDocRef);
        if (!userSnap.exists()) {
          await setDoc(userDocRef, { balance: 100 });
        }

        // Listen for live balance updates
        onSnapshot(userDocRef, (docSnap) => {
          if (docSnap.exists()) {
            document.getElementById("balance").innerText = docSnap.data().balance;
          }
        });

        // Enable betting controls once authenticated
        document.getElementById("submit-bet").disabled = false;
      }
    });

    // 3. Listen for Live Poll Updates
    onSnapshot(pollDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const poll = docSnap.data();
        renderPoll(poll);
      } else {
        document.getElementById("poll-question").innerText = "No active poll found. Click 'Initialize Poll' in Admin.";
      }
    });

    function renderPoll(poll) {
      document.getElementById("poll-question").innerText = poll.question;
      const optionsList = document.getElementById("options-list");
      const adminSelect = document.getElementById("admin-winner");
      
      optionsList.innerHTML = "";
      adminSelect.innerHTML = "";

      poll.options.forEach((opt, index) => {
        // Poll Options UI
        const div = document.createElement("div");
        div.className = "option";
        div.innerHTML = `<input type="radio" name="poll-opt" value="${index}" id="opt-${index}" ${!poll.isOpen ? 'disabled' : ''}>
                         <label for="opt-${index}">${opt}</label>`;
        optionsList.appendChild(div);

        // Admin Dropdown UI
        const selectOpt = document.createElement("option");
        selectOpt.value = index;
        selectOpt.innerText = opt;
        adminSelect.appendChild(selectOpt);
      });

      if (!poll.isOpen) {
        document.getElementById("submit-bet").disabled = true;
        document.getElementById("user-status").innerText = "This poll is closed!";
      } else {
        document.getElementById("submit-bet").disabled = false;
        document.getElementById("user-status").innerText = "";
      }
    }

    // 4. Place Bet (Atomic Firestore Transaction)
    window.placeBet = async function() {
      if (!currentUser) return alert("User not authenticated.");
      
      const amount = parseInt(document.getElementById("bet-amount").value);
      const selectedOpt = document.querySelector('input[name="poll-opt"]:checked');

      if (!selectedOpt) return alert("Select an option.");
      if (isNaN(amount) || amount <= 0) return alert("Enter a valid bet amount.");

      const optionIndex = parseInt(selectedOpt.value);
      const userDocRef = doc(db, "users", currentUser.uid);

      try {
        await runTransaction(db, async (transaction) => {
          const userSnap = await transaction.get(userDocRef);
          const pollSnap = await transaction.get(pollDocRef);

          if (!pollSnap.exists() || !pollSnap.data().isOpen) {
            throw "Poll is not open for betting.";
          }

          const currentBalance = userSnap.data().balance;
          if (currentBalance < amount) {
            throw "Insufficient Doubloons!";
          }

          // Deduct balance and record bet in poll document
          transaction.update(userDocRef, { balance: currentBalance - amount });
          transaction.update(pollDocRef, {
            bets: arrayUnion({
              userId: currentUser.uid,
              optionIndex: optionIndex,
              amount: amount
            })
          });
        });

        document.getElementById("user-status").innerText = `Successfully placed ${amount} doubloon bet!`;
      } catch (err) {
        alert("Betting failed: " + err);
      }
    };

    // 5. Admin: Create/Reset Poll
    window.createNewPoll = async function() {
      await setDoc(pollDocRef, {
        question: "Which ship is the fastest?",
        options: ["The Black Pearl", "The Interceptor", "The Flying Dutchman"],
        isOpen: true,
        bets: []
      });
      alert("New poll created!");
    };

    // 6. Admin: Close Poll & Pay Out Winners
    window.resolvePoll = async function() {
      const winningIndex = parseInt(document.getElementById("admin-winner").value);

      try {
        await runTransaction(db, async (transaction) => {
          const pollSnap = await transaction.get(pollDocRef);
          if (!pollSnap.exists()) throw "No active poll.";

          const poll = pollSnap.data();
          if (!poll.isOpen) throw "Poll is already closed.";

          // Close the poll
          transaction.update(pollDocRef, { isOpen: false });

          // Distribute winnings (2x payout example)
          for (const bet of poll.bets) {
            if (bet.optionIndex === winningIndex) {
              const winnerRef = doc(db, "users", bet.userId);
              const winnerSnap = await transaction.get(winnerRef);
              if (winnerSnap.exists()) {
                const newBalance = winnerSnap.data().balance + (bet.amount * 2);
                transaction.update(winnerRef, { balance: newBalance });
              }
            }
          }
        });

        alert("Poll resolved and payouts distributed!");
      } catch (err) {
        alert("Resolution failed: " + err);
      }
    };
  </script>
</body>
</html>

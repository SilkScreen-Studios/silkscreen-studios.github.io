    a:visited {
            color: blueviolet;

    a:hover {

    a:active {

            text-decoration: underline;
    }
    body {
        font-family: 'Fredoka One';
        font-size: 22px;
        background-color: #333333;
        color: white;
    }
    .footnote {
        font-size: 0.8rem;
        color: #888;
        font-family: system-ui, sans-serif;
    }
</style>
<body>

    <header>
        <h1><img src="silkscreen_logo.PNG" alt=""> The SilkScreen Studios Website</h1>
    </header>

    <nav>
        <a href="index.html">Home</a> | 
        <a href="about.html">About</a>
    </nav>

    <main>
        <section>
            <h2>Our Content</h2>

                <a href="extras/i_got_put_into_a_fishfillet.JPG" download>Download my first invention (17/6/26)</a>

    <footer>
        <p id="page-views" class="footnote">Loading page views...</p>
        <p class="footnote">Note: If you use an adblocker, the view counter feature may be blocked from displaying.</p>
    </footer>

    <script>
        const NAMESPACE = "silkscreen_studios_commons_v1";
        const pageViewsEl = document.getElementById('page-views');

        async function updateHomePageViews() {
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/homepage_hits/up`);
                if (!res.ok) throw new Error();
                
                const data = await res.json();
                const count = data.count || data.value || 1;
                pageViewsEl.innerText = `This page has been visited ${count} times.`;
            } catch (err) {
                pageViewsEl.innerText = "This page has been visited 1 time.";
            }
        }

        updateHomePageViews();
    </script>

</body>

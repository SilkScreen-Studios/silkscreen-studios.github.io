<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Rock Paper Scissors | Silkscreen Studios</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 480px; width: 100%; border: 1px solid #334155; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #38bdf8; }
    p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
    
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; margin-bottom: 1.5rem; background: #334155; color: #cbd5e1; word-break: break-all; }
    .status-badge.active { background: #0369a1; color: #e0f2fe; }
    
    .timer-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem; display: none; }
    .timer-progress { height: 100%; width: 100%; background: #ef4444; transition: width 1s linear; }

    .choices { display: flex; gap: 12px; justify-content: center; margin-bottom: 1.5rem; }
    .choice-btn { background: #334155; border: 2px solid transparent; font-size: 2.5rem; padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; flex: 1; }
    .choice-btn:hover:not(:disabled) { transform: translateY(-4px); background: #475569; border-color: #38bdf8; }
    .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .choice-btn.selected { border-color: #22c55e; background: #14532d; }

    .btn-group { display: flex; gap: 10px; margin-bottom: 1rem; }
    .btn { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; flex: 1; }
    .btn:hover:not(:disabled) { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .btn-sec { background: #334155; color: #e2e8f0; }
    .btn-sec:hover:not(:disabled) { background: #475569; }

    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; font-size: 1rem; margin-bottom: 10px; }

    .result-display { font-size: 1.25rem; font-weight: bold; margin: 1rem 0; min-height: 30px; }
    .win { color: #4ade80; }
    .lose { color: #f87171; }
    .draw { color: #facc15; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rock Paper Scissors</h1>
    <p>Silkscreen Studios Multiplayer</p>

    <div id="status" class="status-badge">Initializing Peer Connection...</div>

    <div class="timer-bar" id="timerBar">
      <div class="timer-progress" id="timerProgress"></div>
    </div>

    <div class="choices">
      <button class="choice-btn" id="btn-rock" onclick="makeChoice('rock')" disabled>🪨</button>
      <button class="choice-btn" id="btn-paper" onclick="makeChoice('paper')" disabled>📄</button>
      <button class="choice-btn" id="btn-scissors" onclick="makeChoice('scissors')" disabled>✂️</button>
    </div>

    <div id="result" class="result-display"></div>

    <div id="setupControls">
      <div class="btn-group">
        <button id="hostBtn" class="btn" onclick="hostGame()">Host Game</button>
      </div>
      <p style="margin-bottom: 8px; font-size: 0.85rem;">OR Join via Room ID:</p>
      <input type="text" id="joinInput" placeholder="Enter Host Room ID">
      <button id="joinBtn" class="btn btn-sec" onclick="joinGame()">Join Room</button>
    </div>

    <button id="rematchBtn" class="btn" style="display:none;" onclick="requestRematch()">Play Again</button>
  </div>

  <script>
    const PREFIX = "silkscreen-rps-";
    let peer = null;
    let conn = null;
    let myChoice = null;
    let opponentChoice = null;
    let timerInterval = null;
    let timeLeft = 5;

    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const timerBar = document.getElementById('timerBar');
    const timerProgress = document.getElementById('timerProgress');
    const setupControls = document.getElementById('setupControls');
    const rematchBtn = document.getElementById('rematchBtn');
    const choiceBtns = ['rock', 'paper', 'scissors'].map(id => document.getElementById(`btn-${id}`));

    // Initialize peer without explicit ID to let server assign an optimal connection
    function initPeer(customId = null) {
      if (peer) peer.destroy();
      
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        if (customId) {
          statusEl.textContent = `Room Created! Room ID: ${id.replace(PREFIX, '')}`;
          statusEl.classList.add('active');
        } else {
          statusEl.textContent = "Connected to network. Host or join below!";
        }
      });

      peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupConnection();
      });

      peer.on('error', (err) => {
        console.error("Peer Error:", err);
        statusEl.textContent = "Connection error. Try hosting or joining again.";
      });
    }

    function hostGame() {
      // Create a short 4-character room ID
      const roomId = PREFIX + Math.floor(1000 + Math.random() * 9000);
      initPeer(roomId);
    }

    function joinGame() {
      const code = document.getElementById('joinInput').value.trim();
      if (!code) {
        alert("Please enter a Room ID from the host device.");
        return;
      }

      const targetId = PREFIX + code;
      statusEl.textContent = `Connecting to Room ${code}...`;
      
      conn = peer.connect(targetId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        statusEl.textContent = "Matched! Choose in 5 seconds!";
        statusEl.classList.add('active');
        setupControls.style.display = 'none';
        startBattlePhase();
      });

      conn.on('data', (data) => {
        if (data.type === 'choice') {
          opponentChoice = data.value;
          checkGameEnd();
        } else if (data.type === 'rematch') {
          resetForRematch();
        }
      });

      conn.on('close', () => {
        statusEl.textContent = "Opponent disconnected.";
        statusEl.classList.remove('active');
        disableChoices();
        setupControls.style.display = 'block';
        rematchBtn.style.display = 'none';
      });
    }

    function startBattlePhase() {
      enableChoices();
      timeLeft = 5;
      myChoice = null;
      opponentChoice = null;
      resultEl.textContent = "";
      rematchBtn.style.display = "none";
      timerBar.style.display = 'block';
      timerProgress.style.width = '100%';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerProgress.style.width = `${(timeLeft / 5) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          disableChoices();
          if (!myChoice) {
            const options = ['rock', 'paper', 'scissors'];
            makeChoice(options[Math.floor(Math.random() * 3)]);
          }
        }
      }, 1000);
    }

    function makeChoice(choice) {
      if (myChoice) return;
      myChoice = choice;

      choiceBtns.forEach(btn => btn.classList.remove('selected'));
      document.getElementById(`btn-${choice}`).classList.add('selected');
      disableChoices();

      if (conn && conn.open) {
        conn.send({ type: 'choice', value: choice });
      }

      checkGameEnd();
    }

    function checkGameEnd() {
      if (myChoice && opponentChoice) {
        clearInterval(timerInterval);
        timerBar.style.display = 'none';

        const outcome = getWinner(myChoice, opponentChoice);
        const emojiMap = { rock: '🪨', paper: '📄', scissors: '✂️' };

        if (outcome === 'win') {
          resultEl.innerHTML = `<span class="win">You Win!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
        } else if (outcome === 'lose') {
          resultEl.innerHTML = `<span class="lose">You Lose!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
        } else {
          resultEl.innerHTML = `<span class="draw">Draw!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
        }

        rematchBtn.style.display = 'inline-block';
      } else if (myChoice) {
        statusEl.textContent = "Choice locked! Waiting for opponent...";
      }
    }

    function getWinner(p1, p2) {
      if (p1 === p2) return 'draw';
      if (
        (p1 === 'rock' && p2 === 'scissors') ||
        (p1 === 'paper' && p2 === 'rock') ||
        (p1 === 'scissors' && p2 === 'paper')
      ) {
        return 'win';
      }
      return 'lose';
    }

    function requestRematch() {
      if (conn && conn.open) {
        conn.send({ type: 'rematch' });
        resetForRematch();
      }
    }

    function resetForRematch() {
      choiceBtns.forEach(btn => btn.classList.remove('selected'));
      startBattlePhase();
    }

    function enableChoices() {
      choiceBtns.forEach(btn => btn.disabled = false);
    }

    function disableChoices() {
      choiceBtns.forEach(btn => btn.disabled = true);
    }

    initPeer();
  </script>
</body>
</html>

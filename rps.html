<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Rock Paper Scissors | Silkscreen Studios</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 480px; width: 100%; border: 1px solid #334155; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #38bdf8; }
    p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
    
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; margin-bottom: 1.5rem; background: #334155; color: #cbd5e1; }
    .status-badge.active { background: #0369a1; color: #e0f2fe; }
    
    .timer-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem; display: none; }
    .timer-progress { height: 100%; width: 100%; background: #ef4444; transition: width 1s linear; }

    .choices { display: flex; gap: 12px; justify-content: center; margin-bottom: 1.5rem; }
    .choice-btn { background: #334155; border: 2px solid transparent; font-size: 2.5rem; padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; flex: 1; }
    .choice-btn:hover:not(:disabled) { transform: translateY(-4px); background: #475569; border-color: #38bdf8; }
    .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .choice-btn.selected { border-color: #22c55e; background: #14532d; }

    .btn { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn:hover:not(:disabled) { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    .result-display { font-size: 1.25rem; font-weight: bold; margin: 1rem 0; min-height: 30px; }
    .win { color: #4ade80; }
    .lose { color: #f87171; }
    .draw { color: #facc15; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rock Paper Scissors</h1>
    <p>Silkscreen Studios Live Multiplayer</p>

    <div id="status" class="status-badge">Connecting to server...</div>

    <div class="timer-bar" id="timerBar">
      <div class="timer-progress" id="timerProgress"></div>
    </div>

    <div class="choices">
      <button class="choice-btn" id="btn-rock" onclick="makeChoice('rock')" disabled>🪨</button>
      <button class="choice-btn" id="btn-paper" onclick="makeChoice('paper')" disabled>📄</button>
      <button class="choice-btn" id="btn-scissors" onclick="makeChoice('scissors')" disabled>✂️</button>
    </div>

    <div id="result" class="result-display"></div>

    <button id="actionBtn" class="btn" onclick="startMatchmaking()" disabled>Find Opponent</button>
  </div>

  <script>
    const LOBBY_TOPIC = "silkscreen/rps/matchmaking/v2";
    const myClientId = "player_" + Math.random().toString(36).substring(2, 10);
    
    let client = null;
    let gameRoomTopic = null;
    let myChoice = null;
    let opponentChoice = null;
    let timerInterval = null;
    let broadcastInterval = null;
    let timeLeft = 5;
    let state = "IDLE"; // IDLE, WAITING, MATCHING, IN_GAME

    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const actionBtn = document.getElementById('actionBtn');
    const timerBar = document.getElementById('timerBar');
    const timerProgress = document.getElementById('timerProgress');
    const choiceBtns = ['rock', 'paper', 'scissors'].map(id => document.getElementById(`btn-${id}`));

    function connectBroker() {
      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      client.on('connect', () => {
        statusEl.textContent = "Online - Click to Play";
        actionBtn.disabled = false;
        client.subscribe(LOBBY_TOPIC);
      });

      client.on('message', (topic, payload) => {
        const msg = JSON.parse(payload.toString());

        // Global Lobby Traffic
        if (topic === LOBBY_TOPIC) {
          // Case 1: We are searching, and see a WAITING player
          if (state === "MATCHING" && msg.type === "WAITING" && msg.sender !== myClientId) {
            state = "PENDING_ACK";
            client.publish(LOBBY_TOPIC, JSON.stringify({
              type: "JOIN_REQUEST",
              hostId: msg.sender,
              guestId: myClientId
            }));
          }
          
          // Case 2: We were WAITING, and received a JOIN_REQUEST
          else if (state === "WAITING" && msg.type === "JOIN_REQUEST" && msg.hostId === myClientId) {
            // Lock room state to block 3rd-wheel players
            state = "IN_GAME";
            clearInterval(broadcastInterval);
            gameRoomTopic = "silkscreen/rps/room/" + myClientId + "_" + msg.guestId;
            client.subscribe(gameRoomTopic);

            // Confirm match to the guest
            client.publish(LOBBY_TOPIC, JSON.stringify({
              type: "MATCH_ACK",
              hostId: myClientId,
              guestId: msg.guestId,
              roomTopic: gameRoomTopic
            }));

            startMatch();
          }

          // Case 3: We sent a JOIN_REQUEST and host ACCEPTED us
          else if (state === "PENDING_ACK" && msg.type === "MATCH_ACK" && msg.guestId === myClientId) {
            state = "IN_GAME";
            clearInterval(broadcastInterval);
            gameRoomTopic = msg.roomTopic;
            client.subscribe(gameRoomTopic);

            startMatch();
          }
        } 
        
        // Private Game Room Traffic
        else if (topic === gameRoomTopic && msg.sender !== myClientId) {
          if (msg.type === "CHOICE") {
            opponentChoice = msg.value;
            checkGameEnd();
          } else if (msg.type === "REMATCH") {
            resetMatch();
          }
        }
      });
    }

    function startMatchmaking() {
      actionBtn.disabled = true;
      resultEl.textContent = "";
      statusEl.textContent = "Searching for online opponent...";
      statusEl.classList.add('active');

      state = "MATCHING";

      // Periodically broadcast WAITING status if no immediate match is found
      clearInterval(broadcastInterval);
      broadcastInterval = setInterval(() => {
        if (state === "MATCHING" || state === "WAITING") {
          state = "WAITING";
          client.publish(LOBBY_TOPIC, JSON.stringify({
            type: "WAITING",
            sender: myClientId
          }));
        }
      }, 1500);
    }

    function startMatch() {
      statusEl.textContent = "Matched! Choose in 5s!";
      enableChoices();
      myChoice = null;
      opponentChoice = null;
      timeLeft = 5;
      timerBar.style.display = 'block';
      timerProgress.style.width = '100%';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerProgress.style.width = `${(timeLeft / 5) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          disableChoices();
          if (!myChoice) {
            const options = ['rock', 'paper', 'scissors'];
            makeChoice(options[Math.floor(Math.random() * 3)]);
          }
        }
      }, 1000);
    }

    function makeChoice(choice) {
      if (myChoice) return;
      myChoice = choice;

      choiceBtns.forEach(btn => btn.classList.remove('selected'));
      document.getElementById(`btn-${choice}`).classList.add('selected');
      disableChoices();

      client.publish(gameRoomTopic, JSON.stringify({
        type: "CHOICE",
        sender: myClientId,
        value: choice
      }));

      checkGameEnd();
    }

    function checkGameEnd() {
      if (myChoice && opponentChoice) {
        clearInterval(timerInterval);
        timerBar.style.display = 'none';

        const outcome = getWinner(myChoice, opponentChoice);
        const emojiMap = { rock: '🪨', paper: '📄', scissors: '✂️' };

        if (outcome === 'win') {
          resultEl.innerHTML = `<span class="win">You Win!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
        } else if (outcome === 'lose') {
          resultEl.innerHTML = `<span class="lose">You Lose!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
        } else {
          resultEl.innerHTML = `<span class="draw">Draw!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
        }

        actionBtn.textContent = "Play Again";
        actionBtn.disabled = false;
        actionBtn.onclick = requestRematch;
      } else if (myChoice) {
        statusEl.textContent = "Choice submitted! Waiting for opponent...";
      }
    }

    function getWinner(p1, p2) {
      if (p1 === p2) return 'draw';
      if (
        (p1 === 'rock' && p2 === 'scissors') ||
        (p1 === 'paper' && p2 === 'rock') ||
        (p1 === 'scissors' && p2 === 'paper')
      ) {
        return 'win';
      }
      return 'lose';
    }

    function requestRematch() {
      client.publish(gameRoomTopic, JSON.stringify({
        type: "REMATCH",
        sender: myClientId
      }));
      resetMatch();
    }

    function resetMatch() {
      choiceBtns.forEach(btn => btn.classList.remove('selected'));
      startMatch();
    }

    function enableChoices() {
      choiceBtns.forEach(btn => btn.disabled = false);
    }

    function disableChoices() {
      choiceBtns.forEach(btn => btn.disabled = true);
    }

    connectBroker();
  </script>
</body>
</html>

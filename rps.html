<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Rock Paper Scissors | Silkscreen Studios</title>

  <!-- GOOGLE FONT: FREDOKA -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-color: #242834;
      --text-white: #ffffff;
      --text-dim: #8c93a8;
      --purple-link: #8a2be2;
      --cyan-link: #00bfff;
      --btn-bg: #323846;
      --choice-border-selected: var(--cyan-link);
      --choice-bg-selected: #163d50;
      --win-color: #00ff88;
      --lose-color: #ff4444;
      --draw-color: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', cursive, sans-serif; }
    body { background: var(--bg-color); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    
    .card { background: var(--card-color); padding: 2rem; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.6); text-align: center; max-width: 480px; width: 100%; border: 2px solid #2f3545; }
    
    h1 { font-size: 2.2rem; margin-bottom: 0.2rem; color: var(--text-white); letter-spacing: 0.5px; }
    .subtitle { color: var(--text-dim); margin-bottom: 1.25rem; font-size: 0.95rem; }
    
    .stats-bar { display: flex; justify-content: space-around; background: #13151b; border-radius: 12px; padding: 12px; margin-bottom: 1.25rem; font-size: 0.9rem; border: 1px solid #2a2e3d; }
    .stats-item span { display: block; font-weight: 700; font-size: 1.2rem; margin-top: 2px; }
    .stat-w { color: var(--win-color); }
    .stat-l { color: var(--lose-color); }
    .stat-d { color: var(--draw-color); }

    .status-badge { display: inline-block; padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 0.95rem; margin-bottom: 1.25rem; background: var(--btn-bg); color: var(--text-dim); }
    .status-badge.active { background: var(--purple-link); color: var(--text-white); }
    .status-badge.cyan { background: var(--cyan-link); color: #000; }
    
    .timer-bar { width: 100%; height: 10px; background: #111; border-radius: 5px; overflow: hidden; margin-bottom: 1.25rem; display: none; }
    .timer-progress { height: 100%; width: 100%; background: var(--cyan-link); transition: width 1s linear; }

    .choices { display: flex; gap: 12px; justify-content: center; margin-bottom: 1.25rem; }
    .choice-btn { background: var(--btn-bg); border: 3px solid transparent; font-size: 2.5rem; padding: 16px; border-radius: 16px; cursor: pointer; transition: all 0.2s; flex: 1; }
    .choice-btn:hover:not(:disabled) { transform: translateY(-4px); background: #3d4556; border-color: var(--purple-link); }
    .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .choice-btn.selected { border-color: var(--choice-border-selected); background: var(--choice-bg-selected); }

    .btn-controls { display: flex; flex-direction: column; gap: 10px; margin-top: 0.5rem; }
    .btn { color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: transform 0.1s, opacity 0.2s; width: 100%; }
    .btn:hover:not(:disabled) { opacity: 0.95; transform: translateY(-2px); }
    .btn:disabled { background: #2a2e3d; color: var(--text-dim); cursor: not-allowed; }
    
    .btn-find { background: var(--purple-link); }
    .btn-rematch { background: var(--cyan-link); color: #000; }

    .result-display { font-size: 1.3rem; font-weight: 700; margin: 0.75rem 0; min-height: 32px; }
    .win { color: var(--win-color); }
    .lose { color: var(--lose-color); }
    .draw { color: var(--draw-color); }

    .user-setup { background: #13151b; border-radius: 14px; padding: 20px; margin-bottom: 1.25rem; border: 1px solid #2a2e3d; }
    .user-setup input { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #3a4052; background: #0c0d12; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 12px; }
    .user-setup input:focus { outline: none; border-color: var(--cyan-link); }
    
    .rematch-agree-text { margin-top: 6px; font-size: 0.9rem; color: var(--cyan-link); display: none; }
    .rematch-agree-text.active { display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Silkscreen Studios Live Multiplayer</p>

    <!-- DEVICE USERNAME CREATION -->
    <div id="usernameSection" class="user-setup">
      <p style="margin-bottom: 10px; font-size: 0.95rem;">Set Device Username (Max 10 Chars):</p>
      <input type="text" id="usernameInput" maxlength="10" placeholder="Username">
      <button class="btn btn-find" onclick="saveDeviceUser()">Lock & Save to Device</button>
    </div>

    <!-- MAIN GAME AREA -->
    <div id="gameContainer" style="display:none;">
      
      <!-- STATS DISPLAY -->
      <div class="stats-bar">
        <div class="stats-item">Player: <span id="displayUsername" style="color:var(--cyan-link)">-</span></div>
        <div class="stats-item">Wins: <span id="statWins" class="stat-w">0</span></div>
        <div class="stats-item">Losses: <span id="statLosses" class="stat-l">0</span></div>
        <div class="stats-item">Draws: <span id="statDraws" class="stat-d">0</span></div>
      </div>

      <div id="status" class="status-badge">Connecting...</div>

      <div class="timer-bar" id="timerBar">
        <div class="timer-progress" id="timerProgress"></div>
      </div>

      <div class="choices">
        <button class="choice-btn" id="btn-rock" onclick="makeChoice('rock')" disabled>🪨</button>
        <button class="choice-btn" id="btn-paper" onclick="makeChoice('paper')" disabled>📄</button>
        <button class="choice-btn" id="btn-scissors" onclick="makeChoice('scissors')" disabled>✂️</button>
      </div>

      <div id="result" class="result-display"></div>

      <div class="btn-controls">
        <button id="findBtn" class="btn btn-find" onclick="startNewMatchmaking()" disabled>Find Opponent</button>
        <button id="rematchBtn" class="btn btn-rematch" style="display:none;" onclick="requestRematch()">Request Rematch (8s)</button>
        <div id="rematchAgree" class="rematch-agree-text">Opponent requested rematch. Click 'Request Rematch' to agree!</div>
      </div>

    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const FIREBASE_DB_URL = "https://silkscreen-studios-default-rtdb.firebaseio.com";
    const LOBBY_TOPIC = "silkscreen/rps/matchmaking/v8_compact_secured";

    let deviceUser = null;
    let deviceUUID = null;
    let deviceSecretToken = null;
    let userStats = { wins: 0, losses: 0, draws: 0, total: 0 };

    let client = null;
    let gameRoomTopic = null;
    let myChoice = null;
    let opponentChoice = null;
    let opponentUsername = "Opponent";
    let opponentUUID = null;
    let lastOpponentUUID = null;

    let timerInterval = null;
    let broadcastInterval = null;
    let rematchTimerInterval = null;
    let pingInterval = null;
    let lastPingTime = Date.now();
    
    let timeLeft = 5;
    let rematchTimeLeft = 8;
    
    let state = "IDLE"; 
    let rematchMyAgree = false;
    let rematchOppAgree = false;

    const usernameSection = document.getElementById('usernameSection');
    const gameContainer = document.getElementById('gameContainer');
    const displayUsername = document.getElementById('displayUsername');
    const statWins = document.getElementById('statWins');
    const statLosses = document.getElementById('statLosses');
    const statDraws = document.getElementById('statDraws');

    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const findBtn = document.getElementById('findBtn');
    const rematchBtn = document.getElementById('rematchBtn');
    const rematchAgreeText = document.getElementById('rematchAgree');
    const timerBar = document.getElementById('timerBar');
    const timerProgress = document.getElementById('timerProgress');
    const choiceBtns = ['rock', 'paper', 'scissors'].map(id => document.getElementById(`btn-${id}`));

    // --- DEVICE IDENTITY & SECURE TOKENS ---

    function initDeviceIdentity() {
      deviceUUID = localStorage.getItem('rps_device_uuid');
      if (!deviceUUID) {
        deviceUUID = "dev_" + Math.random().toString(36).substring(2, 12);
        localStorage.setItem('rps_device_uuid', deviceUUID);
      }

      deviceSecretToken = localStorage.getItem('rps_secret_token');
      if (!deviceSecretToken) {
        deviceSecretToken = "tok_" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('rps_secret_token', deviceSecretToken);
      }

      deviceUser = localStorage.getItem('rps_username');
      if (deviceUser) {
        showGameUI();
      }
    }

    function saveDeviceUser() {
      const input = document.getElementById('usernameInput').value.trim();
      if (!input || input.length > 10) {
        alert("Please enter a valid username (1 to 10 characters).");
        return;
      }
      deviceUser = input;
      localStorage.setItem('rps_username', deviceUser);
      showGameUI();
    }

    async function showGameUI() {
      usernameSection.style.display = 'none';
      gameContainer.style.display = 'block';
      displayUsername.textContent = deviceUser;

      await loadStatsFromFirebase();
      connectBroker();
    }

    // --- COMPACT FIREBASE DATA STORAGE ---
    // Schema: u=username, t=secretToken, w=wins, l=losses, d=draws, ts=timestamp

    async function loadStatsFromFirebase() {
      if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes("https://silkscreenrockpaper-default-rtdb.europe-west1.firebasedatabase.app")) return;
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/users/${deviceUUID}.json`);
        const data = await res.json();
        if (data && data.w !== undefined) {
          userStats.wins = data.w || 0;
          userStats.losses = data.l || 0;
          userStats.draws = data.d || 0;
          updateStatsUI();
        } else {
          saveStatsToFirebase();
        }
      } catch (e) {
        console.error("Firebase read error:", e);
      }
    }

    async function saveStatsToFirebase() {
      if (!FIREBASE_DB_URL || FIREBASE_DB_URL.includes("YOUR_FIREBASE")) return;
      try {
        await fetch(`${FIREBASE_DB_URL}/users/${deviceUUID}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            u: deviceUser,
            t: deviceSecretToken,
            w: userStats.wins,
            l: userStats.losses,
            d: userStats.draws,
            ts: Date.now()
          })
        });
      } catch (e) {
        console.error("Firebase write error:", e);
      }
    }

    function updateStatsUI() {
      statWins.textContent = userStats.wins;
      statLosses.textContent = userStats.losses;
      statDraws.textContent = userStats.draws;
    }

    // --- MULTIPLAYER MATCHMAKING ---

    function connectBroker() {
      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      client.on('connect', () => {
        setLobbyStatus("Online", "normal");
        findBtn.disabled = false;
        client.subscribe(LOBBY_TOPIC);
      });

      client.on('message', (topic, payload) => {
        const msg = JSON.parse(payload.toString());

        if (topic === LOBBY_TOPIC) {
          if (state === "MATCHING" && msg.type === "WAITING" && msg.uuid !== deviceUUID) {
            if (msg.uuid !== lastOpponentUUID) {
              state = "PENDING_ACK";
              client.publish(LOBBY_TOPIC, JSON.stringify({
                type: "JOIN_REQUEST",
                hostUUID: msg.uuid,
                guestUUID: deviceUUID,
                guestName: deviceUser
              }));
            }
          }
          else if (state === "WAITING" && msg.type === "JOIN_REQUEST" && msg.hostUUID === deviceUUID) {
            state = "IN_GAME";
            clearInterval(broadcastInterval);
            
            opponentUUID = msg.guestUUID;
            opponentUsername = msg.guestName || "Opponent";
            lastOpponentUUID = opponentUUID;

            gameRoomTopic = `silkscreen/rps/room/${deviceUUID}_${opponentUUID}`;
            client.subscribe(gameRoomTopic);

            client.publish(LOBBY_TOPIC, JSON.stringify({
              type: "MATCH_ACK",
              hostUUID: deviceUUID,
              guestUUID: opponentUUID,
              hostName: deviceUser,
              roomTopic: gameRoomTopic
            }));

            startMatch();
          }
          else if (state === "PENDING_ACK" && msg.type === "MATCH_ACK" && msg.guestUUID === deviceUUID) {
            state = "IN_GAME";
            clearInterval(broadcastInterval);

            opponentUUID = msg.hostUUID;
            opponentUsername = msg.hostName || "Opponent";
            lastOpponentUUID = opponentUUID;

            gameRoomTopic = msg.roomTopic;
            client.subscribe(gameRoomTopic);

            startMatch();
          }
        } 
        
        // PRIVATE ROOM TRAFFIC
        else if (topic === gameRoomTopic && msg.uuid !== deviceUUID) {
          if (msg.type === "PING") {
            lastPingTime = Date.now();
          } else if (msg.type === "CHOICE") {
            opponentChoice = msg.value;
            checkGameEnd();
          } else if (msg.type === "DRAW_AUTORESET") {
            setLobbyStatus("Draw! Resetting match...", "normal");
            setTimeout(resetMatchForNextRound, 1000); 
          } else if (msg.type === "REMATCH_REQUEST") {
            opponentWantsRematch();
          } else if (msg.type === "DISCONNECT") {
            handleOpponentDisconnect();
          }
        }
      });
    }

    function startNewMatchmaking() {
      if (gameRoomTopic && state === "REMATCH_DECISION") {
        client.publish(gameRoomTopic, JSON.stringify({
          type: "DISCONNECT",
          uuid: deviceUUID
        }));
      }
      _startSearchInternal();
    }

    function _startSearchInternal() {
      stopHeartbeat();
      resetRematchUI();
      findBtn.disabled = true;
      rematchBtn.style.display = 'none';
      resultEl.textContent = "";
      
      let statusText = "Searching for opponent...";
      if (lastOpponentUUID) statusText = "Searching (avoiding previous player)...";
      setLobbyStatus(statusText, "active");

      state = "MATCHING";

      clearInterval(broadcastInterval);
      broadcastInterval = setInterval(() => {
        if (state === "MATCHING" || state === "WAITING") {
          state = "WAITING";
          client.publish(LOBBY_TOPIC, JSON.stringify({
            type: "WAITING",
            uuid: deviceUUID,
            username: deviceUser
          }));
        }
      }, 1500);
    }

    // --- HEARTBEAT & DISCONNECT MANAGEMENT ---

    function startHeartbeat() {
      lastPingTime = Date.now();
      clearInterval(pingInterval);

      pingInterval = setInterval(() => {
        if (state === "IN_GAME") {
          client.publish(gameRoomTopic, JSON.stringify({
            type: "PING",
            uuid: deviceUUID
          }));

          if (Date.now() - lastPingTime > 2500) {
            handleOpponentDisconnect();
          }
        }
      }, 1000);
    }

    function stopHeartbeat() {
      clearInterval(pingInterval);
    }

    function handleOpponentDisconnect() {
      stopHeartbeat();
      clearInterval(timerInterval);
      clearInterval(rematchTimerInterval);

      disableChoices();
      choiceBtns.forEach(btn => btn.classList.remove('selected'));

      timerBar.style.display = 'none';
      resultEl.innerHTML = `<span class="draw">Match Cancelled</span>`;
      setLobbyStatus(`${opponentUsername} disconnected. No stats recorded.`, "normal");

      resetRematchUI();
      findBtn.textContent = "Find New Opponent";
      findBtn.style.display = "inline-block";
      findBtn.disabled = false;
      state = "IDLE";
    }

    window.addEventListener("beforeunload", () => {
      if (gameRoomTopic && (state === "IN_GAME" || state === "REMATCH_DECISION")) {
        client.publish(gameRoomTopic, JSON.stringify({
          type: "DISCONNECT",
          uuid: deviceUUID
        }));
      }
    });

    // --- GAMEPLAY ROUNDS ---

    function startMatch() {
      startHeartbeat();
      setLobbyStatus(`vs ${opponentUsername}! Choose in 5s!`, "cyan");
      enableChoices();
      findBtn.style.display = 'none';
      myChoice = null;
      opponentChoice = null;
      timeLeft = 5;
      timerBar.style.display = 'block';
      timerProgress.style.width = '100%';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerProgress.style.width = `${(timeLeft / 5) * 100}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          disableChoices();

          if (Date.now() - lastPingTime > 2500) {
            handleOpponentDisconnect();
            return;
          }

          if (!myChoice) {
            const options = ['rock', 'paper', 'scissors'];
            makeChoice(options[Math.floor(Math.random() * 3)]);
          }
        }
      }, 1000);
    }

    function makeChoice(choice) {
      if (myChoice) return;
      myChoice = choice;

      choiceBtns.forEach(btn => btn.classList.remove('selected'));
      document.getElementById(`btn-${choice}`).classList.add('selected');
      disableChoices();

      client.publish(gameRoomTopic, JSON.stringify({
        type: "CHOICE",
        uuid: deviceUUID,
        value: choice
      }));

      checkGameEnd();
    }

    function checkGameEnd() {
      if (myChoice && opponentChoice) {
        clearInterval(timerInterval);
        stopHeartbeat();
        timerBar.style.display = 'none';

        const outcome = getWinner(myChoice, opponentChoice);
        const emojiMap = { rock: '🪨', paper: '📄', scissors: '✂️' };

        userStats.total++;

        if (outcome === 'draw') {
          userStats.draws++;
          updateStatsUI();
          saveStatsToFirebase();

          resultEl.innerHTML = `<span class="draw">Draw!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
          setLobbyStatus("Draw! Next round...", "active");
          
          client.publish(gameRoomTopic, JSON.stringify({
            type: "DRAW_AUTORESET",
            uuid: deviceUUID
          }));

          setTimeout(resetMatchForNextRound, 1000); 

        } else {
          if (outcome === 'win') {
            userStats.wins++;
            resultEl.innerHTML = `<span class="win">You Win!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
          } else if (outcome === 'lose') {
            userStats.losses++;
            resultEl.innerHTML = `<span class="lose">You Lose!</span> (${emojiMap[myChoice]} vs ${emojiMap[opponentChoice]})`;
          }
          
          updateStatsUI();
          saveStatsToFirebase();
          showRematchDecisionPhase();
        }
      } else if (myChoice) {
        setLobbyStatus("Choice locked! Waiting for opponent...", "cyan");
      }
    }

    // --- REMATCH & SEPARATION DECISIONS ---

    function showRematchDecisionPhase() {
      state = "REMATCH_DECISION";
      setLobbyStatus("Game Over", "normal");
      
      findBtn.textContent = "Find New Opponent";
      findBtn.style.display = 'inline-block';
      findBtn.disabled = false;
      
      rematchBtn.textContent = "Request Rematch (8s)";
      rematchBtn.style.display = 'inline-block';
      rematchBtn.disabled = false;
      rematchMyAgree = false;
      rematchOppAgree = false;

      rematchTimeLeft = 8;
      clearInterval(rematchTimerInterval);
      rematchTimerInterval = setInterval(() => {
        rematchTimeLeft--;
        rematchBtn.textContent = `Request Rematch (${rematchTimeLeft}s)`;
        
        if (rematchTimeLeft <= 0) {
          clearInterval(rematchTimerInterval);
          rematchTimerExpires();
        }
      }, 1000);
    }

    function requestRematch() {
      if (rematchMyAgree) return;
      rematchMyAgree = true;
      rematchBtn.disabled = true;

      client.publish(gameRoomTopic, JSON.stringify({
        type: "REMATCH_REQUEST",
        uuid: deviceUUID
      }));
      checkRematchConsensus();
    }

    function opponentWantsRematch() {
      if (state !== "REMATCH_DECISION") return;
      rematchOppAgree = true;
      rematchAgreeText.classList.add('active');
      rematchAgreeText.textContent = `${opponentUsername} wants a rematch! Click button to agree.`;
      checkRematchConsensus();
    }

    function checkRematchConsensus() {
      if (rematchMyAgree && rematchOppAgree) {
        clearInterval(rematchTimerInterval);
        resetMatchForNextRound();
      }
    }

    function rematchTimerExpires() {
      if (!rematchMyAgree || !rematchOppAgree) {
        setLobbyStatus("Rematch expired.", "normal");
        disableChoices();
        choiceBtns.forEach(btn => btn.classList.remove('selected'));
        rematchBtn.disabled = true;
        rematchBtn.textContent = "Rematch Expired";
        rematchAgreeText.classList.remove('active');
        findBtn.textContent = "Find New Opponent";
        findBtn.disabled = false;
      }
    }

    function resetRematchUI() {
      clearInterval(rematchTimerInterval);
      rematchBtn.textContent = "Request Rematch (8s)";
      rematchBtn.style.display = "none";
      rematchAgreeText.classList.remove('active');
      findBtn.textContent = "Find Opponent";
    }

    function resetMatchForNextRound() {
      clearInterval(rematchTimerInterval);
      resetRematchUI();
      choiceBtns.forEach(btn => btn.classList.remove('selected'));
      state = "IN_GAME";
      startMatch();
    }

    function getWinner(p1, p2) {
      if (p1 === p2) return 'draw';
      if (
        (p1 === 'rock' && p2 === 'scissors') ||
        (p1 === 'paper' && p2 === 'rock') ||
        (p1 === 'scissors' && p2 === 'paper')
      ) {
        return 'win';
      }
      return 'lose';
    }

    function enableChoices() { choiceBtns.forEach(btn => btn.disabled = false); }
    function disableChoices() { choiceBtns.forEach(btn => btn.disabled = true); }

    function setLobbyStatus(text, context) {
      statusEl.textContent = text;
      statusEl.classList.remove('active', 'cyan');
      if (context === "active") statusEl.classList.add('active');
      if (context === "cyan") statusEl.classList.add('cyan');
    }

    initDeviceIdentity();
  </script>
</body>
</html>
